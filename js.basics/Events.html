<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events javascript</title>
    <link rel="stylesheet" href="events.css">
</head>
<body>
    <h1>javascript html events</h1>
    <h2>the onclick attribute</h2>

    <button onclick="document.getElementById('demo').innerHTML=Date()">THE TIME IS:</button>
    <P id="demo"></P>

    <button onclick="console.log('button was clicked');alert('hello')">
        click me!
    </button>

<button ondblclick="console.log('button was clicked 2x')">
    click me 2 times!
</button>
 
<button id="btn">click me</button>

<button id="me" onmouseover="document.querySelector('#me').textContent='hello javascript!' ">This is a box</button>
    <script src="events.js"></script>
</body>
</html>
